<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Preview: the scene stopped part-way through. -->
  <style>*{animation-play-state:paused!important;animation-delay:-11s!important}</style>
  <title>Desert Stars</title>
  <defs>
    <linearGradient id="ds-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".6" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#3a2a4a"/>
    </linearGradient>
    <linearGradient id="ds-meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ds-band"><stop offset="0" stop-color="#b4c0ff" stop-opacity=".14"/><stop offset="1" stop-color="#b4c0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    /* The sky turns about the pole star once every ten minutes. */
    .sky { animation: turn 600s linear infinite; transform-origin: 1380px 260px; }
    .twinkle { animation: twinkle ease-in-out infinite alternate; }
    .meteor { animation: meteor 19s ease-in infinite; opacity: 0; }
    .ember { animation: ember 2.4s ease-in-out infinite alternate; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }
    @keyframes meteor { 0%, 88% { opacity: 0; transform: translate(0, 0); } 90% { opacity: 1; } 96% { opacity: 0; transform: translate(-520px, 300px); } 100% { opacity: 0; } }
    @keyframes ember { from { opacity: .7; transform: scale(.94); } to { opacity: 1; transform: scale(1.06); } }
  </style>

  <rect width="1920" height="1080" fill="url(#ds-sky)"/>

  <!-- stars scattered on a disc around the pole, wide enough to fill the screen as it turns -->
  <g class="sky" fill="#f4f1ff">
    <circle cx="1380" cy="260" r="3"/>
    <g id="ds-stars">
      <circle cx="200" cy="120" r="1.6"/><circle cx="460" cy="60" r="1.2"/><circle cx="620" cy="300" r="1.8"/><circle cx="880" cy="140" r="1.3"/>
      <circle cx="1040" cy="420" r="1.5"/><circle cx="1200" cy="80" r="2"/><circle cx="1600" cy="160" r="1.4"/><circle cx="1760" cy="380" r="1.7"/>
      <circle cx="1880" cy="90" r="1.2"/><circle cx="320" cy="400" r="1.3"/><circle cx="760" cy="520" r="1.1"/><circle cx="1500" cy="520" r="1.4"/>
      <circle cx="90" cy="300" r="1.1"/><circle cx="1960" cy="560" r="1.5"/><circle cx="2200" cy="200" r="1.6"/><circle cx="2400" cy="600" r="1.3"/>
      <circle cx="600" cy="-200" r="1.5"/><circle cx="1100" cy="-300" r="1.2"/><circle cx="1700" cy="-260" r="1.8"/><circle cx="2300" cy="-100" r="1.4"/>
      <circle cx="-200" cy="500" r="1.6"/><circle cx="400" cy="760" r="1.2"/><circle cx="1000" cy="820" r="1.5"/><circle cx="1800" cy="900" r="1.3"/>
      <circle cx="2500" cy="900" r="1.2"/><circle cx="-100" cy="-100" r="1.4"/><circle cx="2600" cy="300" r="1.5"/><circle cx="300" cy="-400" r="1.2"/>
      <circle cx="1400" cy="-500" r="1.6"/><circle cx="2100" cy="-450" r="1.3"/><circle cx="-300" cy="900" r="1.4"/><circle cx="700" cy="1000" r="1.2"/>
    </g>
    <g class="twinkle" style="animation-duration:3s"><circle cx="980" cy="230" r="2.4"/><circle cx="1680" cy="420" r="2.2"/><circle cx="2000" cy="-200" r="2.4"/></g>
    <g class="twinkle" style="animation-duration:4.4s;animation-delay:-2s"><circle cx="520" cy="200" r="2.2"/><circle cx="1260" cy="560" r="2.4"/><circle cx="160" cy="700" r="2.2"/></g>
    <!-- a faint band of the galaxy -->
    <ellipse cx="900" cy="300" rx="1100" ry="120" fill="url(#ds-band)" transform="rotate(-24 900 300)"/>
  </g>

  <g class="meteor" style="animation-delay:-6s"><rect x="1500" y="140" width="160" height="2" rx="1" fill="url(#ds-meteor)" transform="rotate(-30 1660 141)"/></g>
  <g class="meteor" style="animation-duration:27s;animation-delay:-20s"><rect x="900" y="90" width="120" height="2" rx="1" fill="url(#ds-meteor)" transform="rotate(-30 1020 91)"/></g>

  <!-- dunes -->
  <path d="M0 760c220-70 460-90 700-40s420 60 640 0 420-80 580-50V1080H0z" fill="#2b2140"/>
  <path d="M0 860c300-80 520-60 780-10s520 50 760-10 300-40 380-30V1080H0z" fill="#1f1830"/>
  <path d="M0 960c260-40 600-50 900-10s640 20 1020-20V1080H0z" fill="#151022"/>

  <!-- a small camp: tent and fire -->
  <path d="M500 900l70-100 70 100z" fill="#3a2a46"/>
  <path d="M570 800l-14 100h28z" fill="#0d0a16"/>
  <g class="ember" style="transform-origin:700px 896px">
    <circle cx="700" cy="890" r="60" fill="#ff8a3d" opacity=".12"/>
    <path d="M688 898c0-14 8-20 12-30 4 10 12 16 12 30z" fill="#ffb347"/>
    <path d="M694 898c0-8 4-12 6-18 2 6 6 10 6 18z" fill="#fff0b0"/>
  </g>
</svg>
