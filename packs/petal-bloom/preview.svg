<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Preview: the scene stopped part-way through. -->
  <style>*{animation-play-state:paused!important;animation-delay:-11s!important}</style>
  <title>Petal Bloom</title>
  <defs>
    <radialGradient id="pb-bg" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#f3e3ee"/>
    </radialGradient>
    <path id="pb-petal" d="M0 0c40-60 40-160 0-230c-40 70-40 170 0 230z"/>
    <path id="pb-small" d="M0 0c22-34 22-90 0-130c-22 40-22 96 0 130z"/>
  </defs>
  <style>
    .turn { animation: turn linear infinite; transform-origin: 0 0; }
    .back { animation: turn linear infinite reverse; transform-origin: 0 0; }
    .breathe { animation: breathe 9s ease-in-out infinite alternate; transform-origin: 960px 540px; }
    .drift { animation: drift ease-in-out infinite alternate; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes breathe { from { transform: scale(.93); } to { transform: scale(1.05); } }
    @keyframes drift { from { transform: translate(-16px, 10px); } to { transform: translate(16px, -10px); } }
  </style>

  <rect width="1920" height="1080" fill="url(#pb-bg)"/>

  <!-- soft circles drifting in the background -->
  <g opacity=".5">
    <circle class="drift" cx="260" cy="220" r="160" fill="#ffd9c7" style="animation-duration:11s"/>
    <circle class="drift" cx="1700" cy="860" r="200" fill="#e7d6f6" style="animation-duration:13s;animation-delay:-4s"/>
    <circle class="drift" cx="1640" cy="160" r="110" fill="#d6efe6" style="animation-duration:9s;animation-delay:-2s"/>
    <circle class="drift" cx="300" cy="900" r="130" fill="#fbe7b8" style="animation-duration:12s;animation-delay:-6s"/>
  </g>

  <g class="breathe"><g transform="translate(960 540) scale(1.75) translate(-960 -540)">
    <!-- outer ring: twelve petals, turning slowly -->
    <g transform="translate(960 540)" fill="#f6b8a8" opacity=".75"><g class="turn" style="animation-duration:180s">
      <use href="#pb-petal" transform="rotate(0)"/><use href="#pb-petal" transform="rotate(30)"/><use href="#pb-petal" transform="rotate(60)"/>
      <use href="#pb-petal" transform="rotate(90)"/><use href="#pb-petal" transform="rotate(120)"/><use href="#pb-petal" transform="rotate(150)"/>
      <use href="#pb-petal" transform="rotate(180)"/><use href="#pb-petal" transform="rotate(210)"/><use href="#pb-petal" transform="rotate(240)"/>
      <use href="#pb-petal" transform="rotate(270)"/><use href="#pb-petal" transform="rotate(300)"/><use href="#pb-petal" transform="rotate(330)"/>
    </g></g>
    <!-- middle ring, offset and turning the other way -->
    <g transform="translate(960 540)" fill="#e98fa0" opacity=".7"><g class="back" style="animation-duration:120s">
      <use href="#pb-small" transform="rotate(15)"/><use href="#pb-small" transform="rotate(45)"/><use href="#pb-small" transform="rotate(75)"/>
      <use href="#pb-small" transform="rotate(105)"/><use href="#pb-small" transform="rotate(135)"/><use href="#pb-small" transform="rotate(165)"/>
      <use href="#pb-small" transform="rotate(195)"/><use href="#pb-small" transform="rotate(225)"/><use href="#pb-small" transform="rotate(255)"/>
      <use href="#pb-small" transform="rotate(285)"/><use href="#pb-small" transform="rotate(315)"/><use href="#pb-small" transform="rotate(345)"/>
    </g></g>
    <!-- inner ring -->
    <g transform="translate(960 540) scale(.5)" fill="#c86f8e" opacity=".75"><g class="turn" style="animation-duration:90s">
      <use href="#pb-small" transform="rotate(0)"/><use href="#pb-small" transform="rotate(45)"/><use href="#pb-small" transform="rotate(90)"/>
      <use href="#pb-small" transform="rotate(135)"/><use href="#pb-small" transform="rotate(180)"/><use href="#pb-small" transform="rotate(225)"/>
      <use href="#pb-small" transform="rotate(270)"/><use href="#pb-small" transform="rotate(315)"/>
    </g></g>
    <circle cx="960" cy="540" r="26" fill="#f5c46b"/>
    <circle cx="960" cy="540" r="12" fill="#fff1c9"/>
  </g></g>
</svg>
