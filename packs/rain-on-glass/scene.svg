<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <title>Rain on Glass</title>
  <defs>
    <linearGradient id="rg-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".7" stop-color="#16203a"/>
      <stop offset="1" stop-color="#1f2440"/>
    </linearGradient>
    <radialGradient id="rg-bffb35c"><stop offset="0" stop-color="#ffb35c" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb35c" stop-opacity=".35"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-bffd27a"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-bff7a6b"><stop offset="0" stop-color="#ff7a6b" stop-opacity=".9"/><stop offset=".45" stop-color="#ff7a6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a6b" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-b7fc4ff"><stop offset="0" stop-color="#7fc4ff" stop-opacity=".9"/><stop offset=".45" stop-color="#7fc4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fc4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-bc9a4ff"><stop offset="0" stop-color="#c9a4ff" stop-opacity=".9"/><stop offset=".45" stop-color="#c9a4ff" stop-opacity=".35"/><stop offset="1" stop-color="#c9a4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-bff9a5c"><stop offset="0" stop-color="#ff9a5c" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9a5c" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a5c" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-b7fe0d0"><stop offset="0" stop-color="#7fe0d0" stop-opacity=".9"/><stop offset=".45" stop-color="#7fe0d0" stop-opacity=".35"/><stop offset="1" stop-color="#7fe0d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="rg-tower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3b66" stop-opacity="0"/><stop offset=".25" stop-color="#22325a" stop-opacity=".8"/><stop offset="1" stop-color="#1a2645"/></linearGradient>
    <linearGradient id="rg-streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="rg-drop" cx=".4" cy=".35" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#9fb6e0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity=".1"/>
    </radialGradient>
    <path id="rg-line" d="M0 0v90" stroke="url(#rg-streak)" stroke-width="2"/>
  </defs>
  <style>
    .fall { animation: fall linear infinite; }
    .slide { animation: slide ease-in infinite; }
    .glow { animation: glow ease-in-out infinite alternate; }
    @keyframes fall { from { transform: translateY(-200px); } to { transform: translateY(1280px); } }
    @keyframes slide { 0%, 55% { transform: translateY(0); opacity: 1; } 95% { opacity: 1; } 100% { transform: translateY(900px); opacity: 0; } }
    @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  </style>

  <rect width="1920" height="1080" fill="url(#rg-night)"/>

  <!-- the city behind the window, out of focus: soft shapes and glowing gradients, no filters (cheap to redraw) -->
  <g fill="url(#rg-tower)">
    <rect x="80" y="520" width="220" height="560" rx="40"/>
    <rect x="340" y="420" width="180" height="660" rx="40"/>
    <rect x="600" y="580" width="260" height="500" rx="40"/>
    <rect x="930" y="380" width="200" height="700" rx="40"/>
    <rect x="1190" y="500" width="240" height="580" rx="40"/>
    <rect x="1500" y="440" width="190" height="640" rx="40"/>
    <rect x="1740" y="560" width="200" height="520" rx="40"/>
  </g>
  <g>
    <circle class="glow" cx="210" cy="640" r="102" fill="url(#rg-bffb35c)" style="animation-duration:4s"/>
    <circle class="glow" cx="440" cy="520" r="84" fill="url(#rg-bffd27a)" style="animation-duration:5.5s"/>
    <circle class="glow" cx="700" cy="700" r="120" fill="url(#rg-bff7a6b)" style="animation-duration:3.6s"/>
    <circle class="glow" cx="1020" cy="470" r="90" fill="url(#rg-b7fc4ff)" style="animation-duration:6s"/>
    <circle class="glow" cx="1300" cy="620" r="108" fill="url(#rg-bffb35c)" style="animation-duration:4.8s"/>
    <circle class="glow" cx="1590" cy="540" r="78" fill="url(#rg-bc9a4ff)" style="animation-duration:5.2s"/>
    <circle class="glow" cx="1830" cy="690" r="114" fill="url(#rg-bffd27a)" style="animation-duration:4.2s"/>
    <circle class="glow" cx="560" cy="880" r="138" fill="url(#rg-bff9a5c)" style="animation-duration:6.6s"/>
    <circle class="glow" cx="1450" cy="900" r="132" fill="url(#rg-b7fe0d0)" style="animation-duration:5s"/>
  </g>

  <!-- rain falling outside -->
  <g opacity=".6">
    <use href="#rg-line" x="120" class="fall" style="animation-duration:1.1s;animation-delay:-.2s"/>
    <use href="#rg-line" x="310" class="fall" style="animation-duration:.9s;animation-delay:-.7s"/>
    <use href="#rg-line" x="480" class="fall" style="animation-duration:1.2s;animation-delay:-.4s"/>
    <use href="#rg-line" x="650" class="fall" style="animation-duration:1s;animation-delay:-.9s"/>
    <use href="#rg-line" x="820" class="fall" style="animation-duration:1.15s;animation-delay:-.1s"/>
    <use href="#rg-line" x="990" class="fall" style="animation-duration:.95s;animation-delay:-.6s"/>
    <use href="#rg-line" x="1160" class="fall" style="animation-duration:1.05s;animation-delay:-.3s"/>
    <use href="#rg-line" x="1330" class="fall" style="animation-duration:1.25s;animation-delay:-1s"/>
    <use href="#rg-line" x="1500" class="fall" style="animation-duration:.9s;animation-delay:-.5s"/>
    <use href="#rg-line" x="1670" class="fall" style="animation-duration:1.1s;animation-delay:-.8s"/>
    <use href="#rg-line" x="1840" class="fall" style="animation-duration:1s;animation-delay:-.15s"/>
    <use href="#rg-line" x="230" class="fall" style="animation-duration:1.3s;animation-delay:-.95s"/>
    <use href="#rg-line" x="740" class="fall" style="animation-duration:1.35s;animation-delay:-.45s"/>
    <use href="#rg-line" x="1250" class="fall" style="animation-duration:1.4s;animation-delay:-.25s"/>
    <use href="#rg-line" x="1760" class="fall" style="animation-duration:1.3s;animation-delay:-.65s"/>
  </g>

  <!-- drops on the glass: most sit still, a few run down -->
  <g fill="url(#rg-drop)">
    <ellipse cx="260" cy="180" rx="9" ry="11"/><ellipse cx="540" cy="90" rx="6" ry="7"/><ellipse cx="880" cy="230" rx="11" ry="13"/>
    <ellipse cx="1210" cy="140" rx="7" ry="8"/><ellipse cx="1610" cy="260" rx="10" ry="12"/><ellipse cx="1790" cy="110" rx="6" ry="7"/>
    <ellipse cx="160" cy="420" rx="7" ry="9"/><ellipse cx="700" cy="380" rx="5" ry="6"/><ellipse cx="1420" cy="410" rx="8" ry="10"/>
    <ellipse cx="380" cy="300" rx="4" ry="5"/><ellipse cx="1050" cy="330" rx="4" ry="5"/><ellipse cx="1880" cy="380" rx="5" ry="6"/>
    <g class="slide" style="animation-duration:11s;animation-delay:-2s"><ellipse cx="420" cy="140" rx="10" ry="13"/></g>
    <g class="slide" style="animation-duration:14s;animation-delay:-9s"><ellipse cx="1000" cy="80" rx="12" ry="15"/></g>
    <g class="slide" style="animation-duration:9s;animation-delay:-5s"><ellipse cx="1500" cy="160" rx="9" ry="12"/></g>
    <g class="slide" style="animation-duration:16s;animation-delay:-12s"><ellipse cx="1730" cy="60" rx="11" ry="14"/></g>
  </g>
</svg>
