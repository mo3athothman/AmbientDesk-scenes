<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Preview: the scene stopped part-way through. -->
  <style>*{animation-play-state:paused!important;animation-delay:-11s!important}</style>
  <title>Lantern Drift</title>
  <defs>
    <linearGradient id="ld-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset=".55" stop-color="#23204a"/>
      <stop offset="1" stop-color="#4a2a4e"/>
    </linearGradient>
    <radialGradient id="ld-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc977" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ld-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe4a8"/>
      <stop offset=".6" stop-color="#ffa95e"/>
      <stop offset="1" stop-color="#e0643a"/>
    </linearGradient>
    <g id="ld-lantern">
      <circle r="70" fill="url(#ld-glow)"/>
      <path d="M-16-22h32l6 38h-44z" fill="url(#ld-paper)"/>
      <path d="M-16-22h32v-4h-32zM-22 16h44v4h-44z" fill="#7a3324" opacity=".8"/>
      <path d="M-5-18v32M5-18v32" stroke="#c45a34" stroke-width="1.2" opacity=".45"/>
    </g>
  </defs>
  <style>
    .rise { animation: rise linear infinite; }
    .sway { animation: sway ease-in-out infinite alternate; }
    .twinkle { animation: twinkle ease-in-out infinite alternate; }
    .water { animation: shimmer 9s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-1250px); opacity: 0; } }
    @keyframes sway { from { transform: translateX(-24px) rotate(-3deg); } to { transform: translateX(24px) rotate(3deg); } }
    @keyframes twinkle { from { opacity: .25; } to { opacity: .9; } }
    @keyframes shimmer { from { opacity: .35; transform: translateX(-30px); } to { opacity: .7; transform: translateX(30px); } }
  </style>

  <rect width="1920" height="1080" fill="url(#ld-sky)"/>

  <g fill="#fff6e0">
    <circle class="twinkle" cx="180" cy="120" r="2" style="animation-duration:3.1s"/>
    <circle class="twinkle" cx="420" cy="260" r="1.6" style="animation-duration:4.3s;animation-delay:-1s"/>
    <circle class="twinkle" cx="760" cy="90" r="2.2" style="animation-duration:3.7s;animation-delay:-2s"/>
    <circle class="twinkle" cx="1010" cy="210" r="1.4" style="animation-duration:5.2s"/>
    <circle class="twinkle" cx="1290" cy="70" r="2" style="animation-duration:4.1s;animation-delay:-3s"/>
    <circle class="twinkle" cx="1560" cy="180" r="1.7" style="animation-duration:3.4s;animation-delay:-1.5s"/>
    <circle class="twinkle" cx="1780" cy="300" r="2.1" style="animation-duration:4.8s;animation-delay:-.5s"/>
    <circle class="twinkle" cx="640" cy="340" r="1.3" style="animation-duration:5.6s;animation-delay:-2.5s"/>
    <circle class="twinkle" cx="1460" cy="380" r="1.5" style="animation-duration:3.9s;animation-delay:-4s"/>
  </g>

  <!-- far hills, then the lake -->
  <path d="M0 760c180-60 330-90 520-60s330 70 520 30 360-110 560-90 250 60 320 80V1080H0z" fill="#1a1636"/>
  <path d="M0 820c240-40 420-30 640 0s420 40 660 10 420-50 620-20V1080H0z" fill="#120f27"/>
  <rect y="860" width="1920" height="220" fill="#0d0b1e"/>
  <g class="water" fill="#ffb469">
    <rect x="300" y="900" width="160" height="3" rx="1.5" opacity=".5"/>
    <rect x="820" y="940" width="220" height="3" rx="1.5" opacity=".4"/>
    <rect x="1320" y="915" width="140" height="3" rx="1.5" opacity=".45"/>
    <rect x="560" y="990" width="260" height="3" rx="1.5" opacity=".3"/>
    <rect x="1500" y="1010" width="200" height="3" rx="1.5" opacity=".3"/>
  </g>

  <!-- lanterns: each rises from the lake and sways as it goes -->
  <g transform="translate(260 1150)"><g class="rise" style="animation-duration:38s;animation-delay:-4s"><g class="sway" style="animation-duration:5s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(540 1150) scale(.7)"><g class="rise" style="animation-duration:46s;animation-delay:-20s"><g class="sway" style="animation-duration:6.5s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(830 1150) scale(1.15)"><g class="rise" style="animation-duration:34s;animation-delay:-12s"><g class="sway" style="animation-duration:4.4s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(1100 1150) scale(.6)"><g class="rise" style="animation-duration:52s;animation-delay:-31s"><g class="sway" style="animation-duration:7s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(1360 1150) scale(.9)"><g class="rise" style="animation-duration:41s;animation-delay:-26s"><g class="sway" style="animation-duration:5.6s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(1620 1150)"><g class="rise" style="animation-duration:36s;animation-delay:-8s"><g class="sway" style="animation-duration:4.9s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(1820 1150) scale(.55)"><g class="rise" style="animation-duration:58s;animation-delay:-40s"><g class="sway" style="animation-duration:6s"><use href="#ld-lantern"/></g></g></g>
  <g transform="translate(130 1150) scale(.5)"><g class="rise" style="animation-duration:60s;animation-delay:-50s"><g class="sway" style="animation-duration:7.4s"><use href="#ld-lantern"/></g></g></g>
</svg>
