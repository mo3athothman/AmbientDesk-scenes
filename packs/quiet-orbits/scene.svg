<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <title>Quiet Orbits</title>
  <defs>
    <radialGradient id="qo-bg" cx=".62" cy=".5" r=".75">
      <stop offset="0" stop-color="#13243a"/>
      <stop offset=".6" stop-color="#0a1322"/>
      <stop offset="1" stop-color="#050912"/>
    </radialGradient>
    <radialGradient id="qo-star" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".35" stop-color="#ffd38a"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .spin { animation: spin linear infinite; transform-origin: 1190px 540px; }
    .pulse { animation: pulse 7s ease-in-out infinite alternate; transform-origin: 1190px 540px; }
    .blink { animation: blink ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(.94); opacity: .85; } to { transform: scale(1.06); opacity: 1; } }
    @keyframes blink { from { opacity: .15; } to { opacity: .8; } }
  </style>

  <rect width="1920" height="1080" fill="url(#qo-bg)"/>

  <g fill="#cfe3ff">
    <circle class="blink" cx="120" cy="140" r="1.6" style="animation-duration:4s"/>
    <circle class="blink" cx="340" cy="820" r="1.4" style="animation-duration:5.5s;animation-delay:-2s"/>
    <circle class="blink" cx="520" cy="300" r="2" style="animation-duration:3.6s;animation-delay:-1s"/>
    <circle class="blink" cx="760" cy="960" r="1.3" style="animation-duration:6s"/>
    <circle class="blink" cx="1700" cy="160" r="1.8" style="animation-duration:4.4s;animation-delay:-3s"/>
    <circle class="blink" cx="1820" cy="880" r="1.5" style="animation-duration:5s;animation-delay:-1.5s"/>
    <circle class="blink" cx="260" cy="560" r="1.2" style="animation-duration:6.4s;animation-delay:-4s"/>
    <circle class="blink" cx="640" cy="80" r="1.5" style="animation-duration:4.9s;animation-delay:-2.6s"/>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#8fb4e6" stroke-opacity=".16" stroke-width="1.5">
    <circle cx="1190" cy="540" r="140"/>
    <circle cx="1190" cy="540" r="230" stroke-dasharray="2 10"/>
    <circle cx="1190" cy="540" r="340"/>
    <circle cx="1190" cy="540" r="470" stroke-dasharray="2 12"/>
    <circle cx="1190" cy="540" r="620"/>
  </g>

  <circle class="pulse" cx="1190" cy="540" r="120" fill="url(#qo-star)"/>
  <circle cx="1190" cy="540" r="34" fill="#fff1cf"/>

  <!-- planets: each group turns about the star -->
  <g class="spin" style="animation-duration:24s"><circle cx="1330" cy="540" r="7" fill="#e9b07a"/></g>
  <g class="spin" style="animation-duration:41s;animation-delay:-13s"><circle cx="1190" cy="310" r="11" fill="#7fc4b8"/></g>
  <g class="spin" style="animation-duration:66s;animation-delay:-40s">
    <circle cx="850" cy="540" r="17" fill="#d97a63"/>
    <circle cx="850" cy="540" r="28" fill="none" stroke="#f0c2a8" stroke-opacity=".5" stroke-width="2"/>
  </g>
  <g class="spin" style="animation-duration:104s;animation-delay:-70s">
    <circle cx="1190" cy="1010" r="22" fill="#6d8fd6"/>
    <circle cx="1190" cy="1010" r="22" fill="#0a1322" opacity=".35" transform="translate(8 -6)"/>
  </g>
  <g class="spin" style="animation-duration:160s;animation-delay:-20s"><circle cx="1810" cy="540" r="9" fill="#c9b6e8"/></g>
</svg>
