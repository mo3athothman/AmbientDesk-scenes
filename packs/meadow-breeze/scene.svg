<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <title>Meadow Breeze</title>
  <defs>
    <linearGradient id="mb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset=".65" stop-color="#e9f5e8"/>
      <stop offset="1" stop-color="#f6f1d8"/>
    </linearGradient>
    <path id="mb-blade" d="M0 0c-9-90 6-180 33-255c-15 81-18 168-12 255z"/>
    <path id="mb-blade2" d="M0 0c6-75 27-144 60-195c-30 66-42 129-45 195z"/>
    <g id="mb-seed">
      <path d="M0 0v-18" stroke="#c9b98f" stroke-width="1.4"/>
      <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity=".95">
        <path d="M0-18l-10-8M0-18l10-8M0-18l-12 0M0-18l12 0M0-18l-7-11M0-18l7-11M0-18v-13"/>
      </g>
    </g>
  </defs>
  <style>
    .sway { animation: sway ease-in-out infinite alternate; }
    .float { animation: float linear infinite; }
    .bob { animation: bob ease-in-out infinite alternate; }
    .cloud { animation: cloud linear infinite; }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes float { from { transform: translate(-200px, 0); } to { transform: translate(2200px, -380px); } }
    @keyframes bob { from { transform: translateY(-20px) rotate(-12deg); } to { transform: translateY(20px) rotate(12deg); } }
    @keyframes cloud { from { transform: translateX(-500px); } to { transform: translateX(2400px); } }
  </style>

  <rect width="1920" height="1080" fill="url(#mb-sky)"/>
  <circle cx="1560" cy="210" r="90" fill="#fff6d6"/>
  <circle cx="1560" cy="210" r="150" fill="#fff6d6" opacity=".35"/>

  <g fill="#ffffff" opacity=".9">
    <g class="cloud" style="animation-duration:160s;animation-delay:-40s"><ellipse cx="0" cy="170" rx="150" ry="34"/><ellipse cx="60" cy="146" rx="90" ry="36"/></g>
    <g class="cloud" style="animation-duration:210s;animation-delay:-150s"><ellipse cx="0" cy="290" rx="110" ry="24"/><ellipse cx="-30" cy="274" rx="60" ry="24"/></g>
  </g>

  <!-- rolling hills -->
  <path d="M0 720c260-90 520-110 820-60s620 70 1100-40V1080H0z" fill="#b9d98f"/>
  <path d="M0 820c300-60 640-50 960 0s640 40 960-30V1080H0z" fill="#93c26e"/>
  <path d="M0 930c320-30 700-20 1000 10s620 10 920-20V1080H0z" fill="#6fa856"/>

  <!-- grass along the front, swaying from its roots: each group turns about its own base -->
  <g fill="#5a9a48"><g transform="translate(140 -30)">
    <g class="sway" style="transform-origin:120px 1090px;animation-duration:3.62s"><use href="#mb-blade" x="100" y="1090"/><use href="#mb-blade2" x="130" y="1090"/><use href="#mb-blade" x="160" y="1090"/></g>
    <g class="sway" style="transform-origin:360px 1090px;animation-duration:4.29s;animation-delay:-1s"><use href="#mb-blade2" x="330" y="1090"/><use href="#mb-blade" x="370" y="1090"/><use href="#mb-blade2" x="400" y="1090"/></g>
    <g class="sway" style="transform-origin:640px 1090px;animation-duration:3.84s;animation-delay:-2s"><use href="#mb-blade" x="610" y="1090"/><use href="#mb-blade" x="650" y="1090"/><use href="#mb-blade2" x="690" y="1090"/></g>
    <g class="sway" style="transform-origin:930px 1090px;animation-duration:4.52s;animation-delay:-.5s"><use href="#mb-blade2" x="900" y="1090"/><use href="#mb-blade" x="940" y="1090"/><use href="#mb-blade" x="975" y="1090"/></g>
    <g class="sway" style="transform-origin:1220px 1090px;animation-duration:4.07s;animation-delay:-1.6s"><use href="#mb-blade" x="1190" y="1090"/><use href="#mb-blade2" x="1225" y="1090"/><use href="#mb-blade" x="1260" y="1090"/></g>
    <g class="sway" style="transform-origin:1510px 1090px;animation-duration:3.73s;animation-delay:-2.4s"><use href="#mb-blade2" x="1480" y="1090"/><use href="#mb-blade" x="1520" y="1090"/><use href="#mb-blade2" x="1555" y="1090"/></g>
    <g class="sway" style="transform-origin:1790px 1090px;animation-duration:4.41s;animation-delay:-.8s"><use href="#mb-blade" x="1760" y="1090"/><use href="#mb-blade" x="1800" y="1090"/><use href="#mb-blade2" x="1840" y="1090"/></g>
  </g></g>
  <g fill="#4e8a3e">
    <g class="sway" style="transform-origin:120px 1090px;animation-duration:3.2s"><use href="#mb-blade" x="100" y="1090"/><use href="#mb-blade2" x="130" y="1090"/><use href="#mb-blade" x="160" y="1090"/></g>
    <g class="sway" style="transform-origin:360px 1090px;animation-duration:3.8s;animation-delay:-1s"><use href="#mb-blade2" x="330" y="1090"/><use href="#mb-blade" x="370" y="1090"/><use href="#mb-blade2" x="400" y="1090"/></g>
    <g class="sway" style="transform-origin:640px 1090px;animation-duration:3.4s;animation-delay:-2s"><use href="#mb-blade" x="610" y="1090"/><use href="#mb-blade" x="650" y="1090"/><use href="#mb-blade2" x="690" y="1090"/></g>
    <g class="sway" style="transform-origin:930px 1090px;animation-duration:4s;animation-delay:-.5s"><use href="#mb-blade2" x="900" y="1090"/><use href="#mb-blade" x="940" y="1090"/><use href="#mb-blade" x="975" y="1090"/></g>
    <g class="sway" style="transform-origin:1220px 1090px;animation-duration:3.6s;animation-delay:-1.6s"><use href="#mb-blade" x="1190" y="1090"/><use href="#mb-blade2" x="1225" y="1090"/><use href="#mb-blade" x="1260" y="1090"/></g>
    <g class="sway" style="transform-origin:1510px 1090px;animation-duration:3.3s;animation-delay:-2.4s"><use href="#mb-blade2" x="1480" y="1090"/><use href="#mb-blade" x="1520" y="1090"/><use href="#mb-blade2" x="1555" y="1090"/></g>
    <g class="sway" style="transform-origin:1790px 1090px;animation-duration:3.9s;animation-delay:-.8s"><use href="#mb-blade" x="1760" y="1090"/><use href="#mb-blade" x="1800" y="1090"/><use href="#mb-blade2" x="1840" y="1090"/></g>
  </g>
  <g fill="#e8b04c">
    <circle cx="260" cy="1000" r="9"/><circle cx="520" cy="1030" r="7"/><circle cx="800" cy="990" r="8"/>
    <circle cx="1100" cy="1020" r="9"/><circle cx="1380" cy="995" r="7"/><circle cx="1680" cy="1015" r="8"/>
  </g>

  <!-- dandelion seeds carried across on the wind -->
  <g class="float" style="animation-duration:34s;animation-delay:-3s"><g transform="translate(0 760)"><g class="bob" style="animation-duration:2.6s"><use href="#mb-seed" transform="scale(2.2)"/></g></g></g>
  <g class="float" style="animation-duration:41s;animation-delay:-17s"><g transform="translate(0 860) scale(1.3)"><g class="bob" style="animation-duration:3.1s"><use href="#mb-seed" transform="scale(2.2)"/></g></g></g>
  <g class="float" style="animation-duration:29s;animation-delay:-11s"><g transform="translate(0 640) scale(.8)"><g class="bob" style="animation-duration:2.2s"><use href="#mb-seed" transform="scale(2.2)"/></g></g></g>
  <g class="float" style="animation-duration:46s;animation-delay:-30s"><g transform="translate(0 900) scale(1.1)"><g class="bob" style="animation-duration:3.4s"><use href="#mb-seed" transform="scale(2.2)"/></g></g></g>
  <g class="float" style="animation-duration:38s;animation-delay:-24s"><g transform="translate(0 700) scale(.9)"><g class="bob" style="animation-duration:2.8s"><use href="#mb-seed" transform="scale(2.2)"/></g></g></g>
</svg>
